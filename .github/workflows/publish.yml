# ============================================================================
# CD — 发布到 npm 官方 registry
#   触发：推 v* tag（自动）或 Actions → Publish npm → Run workflow（手动）
#
# 闸门（任一条不过就中止，绝不在没验过的情况下发布）：
#   1. tag 名去掉 v 必须与 package.json 的 version 完全一致（tag 触发时）
#   2. 该版本若已在 npm 上 → 跳过发布（幂等：重推同一个 tag / 重跑工作流不会红一条）
#   3. token 必须真的可用（`npm whoami` 先跑一遍，失败早停且错误一目了然）
#   4. 单元测试 + 启动自检（含版本号断言）+ 端到端 A/D 段 + 针对性检查全绿
#
# 认证：**仓库 secret `NPM_TOKEN`**（npm Granular Access Token，需 Packages: Read and write），
#   运行期注入为 `NODE_AUTH_TOKEN`，配合 setup-node 的 registry-url 生成
#   `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` 使用。
#   刻意不用 Trusted Publishing / OIDC：**本工作流没有 `id-token: write`**，
#   GitHub 不会签发 OIDC token（2.6.1 试过 OIDC，发布步骤失败）。
#   注意别混用：仓库里不能有残留的 `.npmrc`（尤其写死的 `_authToken` 行）——
#   一旦 `_authToken` 被解析成空串，npm 会认为"配了认证但没值"，就不会回退到 Token 路径。
#   `npm whoami` 那一步就是用来把这种情况直接暴露出来的。
# 失败史：2.6.0 首次 tag 发布报 `E404 PUT .../@yuanchilin%2fmcp-serial` ——
#   那是 NPM_TOKEN（classic token）已失效/无该 scope 写权限（npm 对 scoped 包把 403 伪装成 404），
#   与 `--provenance` 无关；改用 granular token 后 2.6.0 发布成功（无 provenance）。
# ============================================================================
name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag（正式版填 latest）
        required: true
        default: latest

permissions:
  contents: read    # 仅 checkout；Release 由 release.yml 负责（不发 OIDC，故无 id-token）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: 发布前闸门（tag 与版本一致 / 版本未被占用）
        id: guard
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            T="${GITHUB_REF_NAME#v}"
            if [ "$T" != "$V" ]; then
              echo "::error::tag v$T 与 package.json 的 $V 不一致，中止"
              exit 1
            fi
          fi
          if npm view "@yuanchilin/mcp-serial@$V" version >/dev/null 2>&1; then
            # 幂等：该版本已经在 npm 上（重推同一个 tag / 重跑本工作流都会走到这里）——
            # 跳过发布而不是失败：npm 本身禁止同版本覆盖，红一条没有任何意义
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@yuanchilin/mcp-serial@$V 已在 npm 上，跳过发布步骤"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${{ inputs.tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          echo "将要发布 @yuanchilin/mcp-serial@$V（dist-tag: ${{ inputs.tag || 'latest' }}）"

      - name: 验证 NPM_TOKEN 可用（缺 token / 失效 / 权限不足都在这里早停）
        if: steps.guard.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::仓库没有配置 secrets.NPM_TOKEN（Settings → Secrets and variables → Actions → New repository secret）"
            exit 1
          fi
          who=$(npm whoami --registry https://registry.npmjs.org) || {
            echo "::error::NPM_TOKEN 无效或已过期/被吊销（npm whoami 失败）"
            exit 1
          }
          echo "token 身份：$who"

      - name: 安装依赖（按 lockfile）
        run: npm ci --no-audit --no-fund
      - name: 安装 chromium（端到端用）
        run: npx playwright install --with-deps chromium

      - name: 单元测试
        run: npm test
      - name: 启动自检（断言版本号）
        run: npm run smoke
      - name: 端到端（A + D）
        run: npm run test:ui
      - name: 针对性检查
        run: npm run test:checks

      - name: 发布到 npm（NPM_TOKEN，granular）
        if: steps.guard.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --registry https://registry.npmjs.org --tag "${{ steps.guard.outputs.dist_tag }}"

