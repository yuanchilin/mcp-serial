# ============================================================================
# CI — 构建 + 单元测试 + 启动自检 + 端到端 UI（chromium）
# 触发：push / pull_request（任何分支）
#
# 覆盖说明（不含"默认跳过"的项）：
#   · 单元测试：三个 Node 版本（20/22/24，>=20 是本项目的硬要求）+ Windows 一份
#   · 启动自检：真的起一次 build/index.js，断言启动横幅里的版本 == package.json 版本
#   · 端到端 UI：verify.mjs 的 A(布局/主题/单实例) + D(假串口/WS/多路) 两段，
#     外加 check-fixes（端口切换/角色/清屏回放）、check-firmware（固件体检）
#     与 check-xmodem（假板子按 XMODEM 收，含一直等 / 立刻取消 / 传输中 409）
#   · **B 段（探测本机 127.0.0.1:9721 正在运行的实例）在 CI 里没有对象，按设计排除**，
#     它属于本机验收：`node test/ui/verify.mjs --only=B`
# ============================================================================
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: 单元测试 (Node ${{ matrix.node }} / ubuntu)
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安装依赖（按 lockfile）
        run: npm ci --no-audit --no-fund
      - name: 单元测试（pretest 会先 build）
        run: npm test
      - name: 启动自检（断言版本号）
        run: npm run smoke

  unit-windows:
    name: 单元测试 (Node 22 / windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖（按 lockfile）
        run: npm ci --no-audit --no-fund
      - name: 单元测试
        run: npm test
      - name: 启动自检
        run: npm run smoke

  ui:
    name: 端到端 UI (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖（按 lockfile）
        run: npm ci --no-audit --no-fund
      - name: 安装 chromium
        run: npx playwright install --with-deps chromium
      - name: 端到端（A 布局/主题 + D 假串口/WS/多路）
        run: npm run test:ui
      - name: 针对性检查（端口切换/角色/清屏回放 + 固件体检 + XMODEM）
        run: npm run test:checks
