<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>串口终端</title>
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;height:100vh;display:flex;flex-direction:column}
#bar{background:#111;padding:3px 8px;display:flex;gap:6px;align-items:center;font:11px Consolas,monospace;color:#c0c0c0;flex-shrink:0;border-bottom:1px solid #222}
#bar select,#bar button{background:#000;color:#c0c0c0;border:1px solid #333;padding:2px 8px;font:inherit;cursor:pointer}
#bar button:hover{background:#222}
#bar .st{color:#888;margin-left:8px}
#bar #ctrl{margin-left:auto}
#tools.hidden{display:none}
/* 控制申请弹框（confirm() 在 iframe 中会被浏览器拦截，且 embed 模式隐藏工具栏，故用自定义模态框） */
#ctrlModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center}
#ctrlModal .box{background:#1a1a1a;border:1px solid #555;border-radius:6px;padding:16px 20px;color:#c0c0c0;font:13px Consolas,monospace;min-width:280px;box-shadow:0 4px 20px rgba(0,0,0,.7)}
#ctrlModal .msg{margin-bottom:14px;line-height:1.5}
#ctrlModal .btns{display:flex;gap:10px;justify-content:flex-end}
#ctrlModal button{border:none;padding:5px 18px;cursor:pointer;border-radius:3px;color:#fff;font:inherit}
#term{height:calc(100vh - 30px);overflow:hidden}
.xterm{height:100%}
.xterm-viewport{height:100%!important}
</style>
</head>
<body>
<div id="bar">
  <select id="ps"><option value="">-- 端口 --</option></select>
  <button onclick="rp()">刷新</button>
  <select id="bs">
    <option value="9600">9600</option><option value="115200" selected>115200</option>
    <option value="230400">230400</option><option value="460800">460800</option><option value="921600">921600</option>
  </select>
  <button id="cb" onclick="tc()">连接</button>
    <span id="tools">
  <button onclick="T.clear()">清除</button>
  <button onclick="copyText()">复制</button>
  <button onclick="saveText()">保存</button>
  
    <button onclick="reqCtrl()">申请控制</button>
    <button onclick="forceCtrl()">强制控制</button>
    <button id="tsBtn" onclick="toggleTs()">🕐 时间戳</button>
    <button id="echoBtn" onclick="toggleEcho()">💬 回显</button>
    </span>
    <button id="foldBtn" onclick="toggleFold()">◀</button>
    <span class="st" id="ctrl">👁 监视端</span>
    <span class="st" id="st">未连接</span>
</div>
<div id="term"></div>
<div id="ctrlModal">
  <div class="box">
    <div class="msg" id="ctrlModalMsg"></div>
    <div class="btns">
      <button onclick="respondCtrl(true)" style="background:#4caf50">同意</button>
      <button onclick="respondCtrl(false)" style="background:#f44336">拒绝</button>
    </div>
  </div>
</div>

<script src="/vendor/xterm/xterm.js"></script>
<script>
const QP=new URLSearchParams(location.search);
const CID=QP.get('cid')||sessionStorage.getItem('xtermCid')||(sessionStorage.setItem('xtermCid',typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'cid-'+Date.now()+'-'+Math.random().toString(36).slice(2,11)),sessionStorage.getItem('xtermCid'));
const B=window.location.origin;
// SERIAL_WEB_TOKEN 透传：从 URL 读取 token，附加到所有 API 调用
const TKN=new URLSearchParams(location.search).get('token')||'';
function q(p){ return TKN ? p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(TKN) : p; }
let es=null;
let currentPort=QP.get('port')||'';
let isFirstSSEMessage=true; // 标记是否为首次 SSE 消息（用于区分历史数据和实时数据）
let sseConnecting=false; // 防止 connectSSE 被并发调用导致连接被反复关闭重建
let initDone=false; // 标记 init() 是否已完成，避免 auto=1 场景下 tc() 和 init() 竞争
// 点击终端区域时，向父页面发送置顶请求（用于多窗口覆盖时选择顶层）
document.addEventListener('mousedown',()=>{
  if(window.parent!==window&&currentPort){
    parent.postMessage({type:'mcpSerialRaise',port:currentPort},'*');
  }
},true); // 捕获阶段，确保在 iframe 内部任何位置点击都能触发

function connectSSE(){
  if(!currentPort||sseConnecting) return;
  sseConnecting=true;
  if(es) es.close();
  isFirstSSEMessage=true;
  es=new EventSource(B+q('/events?clientId='+encodeURIComponent(CID)+'&name=Browser&port='+encodeURIComponent(currentPort)));
  es.onopen=()=>{ sseConnecting=false; };
  es.onerror=()=>{ sseConnecting=false; };
  // 处理默认 message 事件（SSE 无 event: 行的数据，包含历史缓冲区和实时串口数据）
  // 注意：实时串口数据由 WebSocket 处理，SSE 仅用于恢复历史缓冲区（刷新不清屏）
  es.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.text&&isFirstSSEMessage){
        // 首次消息：历史缓冲区数据，静默恢复不清屏
        isFirstSSEMessage=false;
        T.write(d.text);
        log+=d.text;
      }
      // 后续 SSE 消息忽略（WebSocket 会处理实时数据，避免重复显示）
    }catch(_){}
  };
  es.addEventListener('status',e=>{
    try{
      const s=JSON.parse(e.data);
      const isCtrl=s.controllerClientId===CID;
      ctrl.textContent=isCtrl?'🎮 控制端':'👁 监视端';
      ctrl.style.color=isCtrl?'#4caf50':'#888';
    }catch(_){}
  });
  es.addEventListener('control-response',e=>{
    try{
      const d=JSON.parse(e.data);
      T.write(`\r\n[${currentPort}] `+(d.approved?'✅ 已获得控制权':'❌ 申请被拒绝')+(d.autoApproved?'（超时自动同意）':'')+'\r\n');
    }catch(_){}
  });
    es.addEventListener('control-request', e=>{
      T.write(`\r\n[DEBUG] control-request 事件已触发!\r\n`);
      try{
        const d=JSON.parse(e.data);
        T.write(`\r\n[DEBUG] 解析成功: requesterId=${d.requesterId}\r\n`);
        // iframe 中 confirm() 会被浏览器安全策略阻止，且 embed 模式下工具栏整体隐藏，
        // 因此统一使用自定义模态弹框（iframe/embed 场景均可正常显示）
        T.write(`\r\n[${currentPort}] ⚠️ 客户端 ${d.requesterId.slice(0,8)} 请求控制\r\n`);
        // 存储待处理的申请，供按钮回调使用
        window.__pendingControlRequest={port:currentPort,requesterId:d.requesterId};
        const el=document.getElementById('ctrlModal');
        T.write(`\r\n[DEBUG] ctrlModal 元素: ${el?'存在':'不存在!'}\r\n`);
        document.getElementById('ctrlModalMsg').textContent=`客户端 ${d.requesterId.slice(0,8)} 请求控制 ${currentPort}，是否同意？（10 秒未响应将自动同意）`;
        el.style.display='flex';
        T.write(`\r\n[DEBUG] ctrlModal display 已设为 flex\r\n`);
      }catch(err){
        T.write(`\r\n[ERROR] control-request 处理异常: ${err.message} ${err.stack||''}\r\n`);
      }
    });
  es.addEventListener('control-taken',e=>{
    try{
      const d=JSON.parse(e.data);
      // 控制权已变更（如超时自动同意），关闭可能仍显示的申请弹框
      document.getElementById('ctrlModal').style.display='none';
      delete window.__pendingControlRequest;
      if(d.newController===CID){
        T.write(`\r\n[${currentPort}] 🎮 你已成为控制端`+(d.reason?`（${d.reason}）`:'')+'\r\n');
      }else if(d.oldController===CID){
        T.write(`\r\n[${currentPort}] 👁 控制权已移交\r\n`);
      }
    }catch(_){}
  });
}
let ws=null,conn=false,log='',wsRetry=0,wsWarned=false,showTs=false,echo=false,atLineStart=true,folded=localStorage.getItem('mcpSerialFold')==='1';

if(typeof Terminal==='undefined'){document.body.innerHTML='<h3 style="color:#f66;padding:20px">xterm 资源未加载，请先执行 npm run build</h3>';throw new Error('xterm not loaded');}
const T=new Terminal({fontSize:15,fontFamily:'Consolas,Monaco,monospace',disableStdin:false,
  theme:{background:'#000',foreground:'#c0c0c0',cursor:'#fff',selectionBackground:'#444',selectionForeground:'#fff'}});
T.open(document.getElementById('term'));
T.focus();

// 全屏自适应 (实测字符尺寸)
function fit(){
  let el=document.getElementById('term');
  let w=el.clientWidth, h=el.clientHeight;
  if(w<10||h<10)return;
  // 创建测量元素
  let m=document.createElement('span');
  m.style.font=T.options.fontSize+'px '+T.options.fontFamily;
  m.style.position='absolute';m.style.visibility='hidden';
  m.textContent='W';document.body.appendChild(m);
  let cw=m.getBoundingClientRect().width;
  let ch=T.options.fontSize*1.35; // 行高比例
  document.body.removeChild(m);
  T.resize(Math.floor(w/cw), Math.floor(h/ch));
}
setTimeout(fit,100);setTimeout(fit,500);window.addEventListener('resize',fit);

// Ctrl+滚轮缩放
T.element.addEventListener('wheel',e=>{
  if(e.ctrlKey){e.preventDefault();let s=T.options.fontSize||15;s+=e.deltaY>0?-1:1;if(s>=8&&s<=32){T.options.fontSize=s;fit()}}
},{passive:false});

const ps=document.getElementById('ps'),bs=document.getElementById('bs');
const cb=document.getElementById('cb'),st=document.getElementById('st'),ctrl=document.getElementById('ctrl'),tsBtn=document.getElementById('tsBtn'),echoBtn=document.getElementById('echoBtn'),foldBtn=document.getElementById('foldBtn');
if(folded){document.getElementById('tools').classList.add('hidden');foldBtn.textContent='▶';}
if(QP.get('embed')==='1'){document.getElementById('bar').style.display='none';document.getElementById('term').style.height='100vh';}

function ts(){return '['+new Date().toLocaleTimeString('zh-CN',{hour12:false})+'.'+String(Date.now()%1000).padStart(3,'0')+'] ';}

function connectWS(){
  if(ws){try{ws.close()}catch(_){}}
  ws=new WebSocket('ws://'+location.host+q('/?clientId='+encodeURIComponent(CID)+'&port='+encodeURIComponent(currentPort)));
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{wsRetry=0;if(conn)st.textContent=(ps.value||'已连接')+' · WS在线'};
  ws.onmessage=e=>{
  if(e.data instanceof ArrayBuffer){
    let b=lf2crlf(new Uint8Array(e.data));
    let text=new TextDecoder().decode(b);
    if(showTs){
      let out=''; let rest=text; while(true){ const idx=rest.indexOf('\n'); if(idx<0){ if(rest.length>0){ if(atLineStart) out+=ts(); out+=rest; atLineStart=false; } break; } const line=rest.slice(0,idx+1); rest=rest.slice(idx+1); if(atLineStart) out+=ts(); out+=line; atLineStart=true; }
      b=lf2crlf(new TextEncoder().encode(out));
      text=out;
    }
      else {
        if(text.length>0) atLineStart=text.endsWith('\n');
      }
    T.write(b);
    log+=text;
    if(log.length>1<<20)log=log.slice(-1<<19);
  }
}
  ws.onclose=()=>{
    ws=null;
    if(conn){
      wsRetry++;
      if(wsRetry<=10){st.textContent='WS 已断开，重连中('+wsRetry+')...';setTimeout(connectWS,2000);}
      else{conn=false;cb.textContent='连接';cb.style.background='';st.textContent='WS 连接失败，请刷新页面';}
    }else{st.textContent='未连接';}
};

// 设备常只发 LF(\n)：转成 CRLF(\r\n)，避免 xterm 只下移不回车导致行首错位（已含 \r 的保持原样）
function lf2crlf(b){
  const out=[];
  for(let i=0;i<b.length;i++){
    if(b[i]===0x0A&&(i===0||b[i-1]!==0x0D))out.push(0x0D);
    out.push(b[i]);
  }
  return new Uint8Array(out);
}
  ws.onerror=()=>{};
}

// 输入：xterm 官方 onData 通道（统一处理普通按键/IME 组合/粘贴），直通串口
// disableStdin 必须为 false 才会产生 onData；xterm 不把按键写入本地缓冲区（无本地回显）
T.onData(d=>{
  if(echo&&d)T.write(d);
  if(d&&ws&&ws.readyState===WebSocket.OPEN){ws.send(d)}
  else if(!wsWarned){wsWarned=true;T.write('\r\n[未连接或连接已断开：请点击“连接”或刷新页面]\r\n')}
});

async function tc(){
  if(conn){await dc();return}
  let p=ps.value;if(!p)return;
    currentPort=p;connectSSE();
  // 乐观更新：点击立即反馈，失败再回滚
  conn=true;cb.textContent='断开';cb.style.background='#300';st.textContent=p+' · 连接中...';
  let r=await fetch(B+q('/connect'),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({port:p,baudRate:parseInt(bs.value,10)||115200,clientId:CID})});
  if(!r.ok){
    conn=false;cb.textContent='连接';cb.style.background='';st.textContent='连接失败';
    return;
  }
  st.textContent=p;connectWS();T.focus();
    if(window.parent!==window) parent.postMessage({type:'mcpSerialStatus',port:currentPort,connected:true},'*');
}
async function dc(){
  // 乐观更新：点击立即反馈
  conn=false;cb.textContent='连接';cb.style.background='';st.textContent='断开中...';
  try{
    const r=await fetch(B+q('/disconnect'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({port:currentPort,clientId:CID})});
    if(!r.ok){
      const j=await r.json().catch(()=>({}));
      conn=true;cb.textContent='断开';cb.style.background='#300';st.textContent=currentPort;
      T.write(`\r\n[${currentPort}] 断开失败: ${j.error||r.status}\r\n`);
      return;
    }
  }catch(e){
    conn=true;cb.textContent='断开';cb.style.background='#300';st.textContent=currentPort;
    T.write(`\r\n[${currentPort}] 断开失败: ${e.message}\r\n`);
    return;
  }
  if(ws)ws.close();ws=null;
  if(es)es.close();es=null;
  st.textContent='未连接';
  T.write(`\r\n[${currentPort}] 已断开\r\n`);
  if(window.parent!==window) parent.postMessage({type:'mcpSerialStatus',port:currentPort,connected:false},'*');
}
async function ensureSSERegistered(){
  // 确保 SSE 已建立（clientId 已注册到服务端），用于 reqCtrl/forceCtrl 前置校验
  console.log('[ensureSSERegistered] es=',es,'readyState=',es?.readyState,'currentPort=',currentPort,'CID=',CID,'sseConnecting=',sseConnecting);
  if(!es||es.readyState!==EventSource.OPEN){
    if(!currentPort)return false;
    // 如果正在连接中，等待连接完成；否则重新建立连接
    if(!sseConnecting){
      connectSSE();
    }
    // 等待 SSE 建立（最多 3 秒）
    for(let i=0;i<30;i++){
      await new Promise(r=>setTimeout(r,100));
      console.log('[ensureSSERegistered] wait',i,'readyState=',es?.readyState,'sseConnecting=',sseConnecting);
      if(es&&es.readyState===EventSource.OPEN)return true;
    }
    return false;
  }
  return true;
}
async function reqCtrl(){
  try{
    if(!await ensureSSERegistered()){
      T.write('\r\n[控制] 失败: SSE 连接未建立，请先连接串口\r\n');
      return;
    }
    const r=await fetch(B+q('/request-control'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({port:currentPort,clientId:CID})});
    const j=await r.json().catch(()=>({}));
    T.write('\r\n[控制] '+(j.message||('HTTP '+r.status))+'\r\n');
  }catch(e){T.write('\r\n[控制] 申请失败: '+e.message+'\r\n');}
}
async function forceCtrl(){
  try{
    if(!await ensureSSERegistered()){
      T.write('\r\n[控制] 失败: SSE 连接未建立，请先连接串口\r\n');
      return;
    }
    const r=await fetch(B+q('/force-control'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({port:currentPort,clientId:CID})});
    const j=await r.json().catch(()=>({}));
    T.write('\r\n[控制] '+(j.message||('HTTP '+r.status))+'\r\n');
  }catch(e){T.write('\r\n[控制] 强制接管失败: '+e.message+'\r\n');}
}
async function respondCtrl(approve){
  const req=window.__pendingControlRequest;
  document.getElementById('ctrlModal').style.display='none';
  if(!req)return;
  try{
    await fetch(B+q('/respond-control'),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({port:req.port,clientId:CID,requesterId:req.requesterId,approve})});
    T.write(`\r\n[${req.port}] 已${approve?'同意':'拒绝'} ${req.requesterId.slice(0,8)} 的控制申请\r\n`);
  }catch(e){T.write('\r\n[控制] 响应失败: '+e.message+'\r\n');}
  delete window.__pendingControlRequest;
}
function toggleTs(){
  showTs=!showTs;
  tsBtn.textContent=showTs?'🕐 时间戳:开':'🕐 时间戳';
  T.write('\r\n[时间戳] '+(showTs?'已开启':'已关闭')+'\r\n');
}
function toggleEcho(){
  echo=!echo;
  echoBtn.textContent=echo?'💬 回显:开':'💬 回显';
  T.write('\r\n[回显] '+(echo?'已开启':'已关闭')+'\r\n');
}
function toggleFold(){
  folded=!folded;
  localStorage.setItem('mcpSerialFold', folded?'1':'0');
  document.getElementById('tools').classList.toggle('hidden', folded);
  foldBtn.textContent=folded?'▶':'◀';
}

async function rp(){
  try{
    let r=await fetch(B+q('/ports'));
    if(!r.ok)throw new Error(r.status);
    let a=await r.json();
    let cur=ps.value;ps.innerHTML='<option value="">-- 端口 --</option>';
    a.forEach(p=>{let o=document.createElement('option');o.value=p.path;
      o.textContent=p.path+(p.manufacturer?' - '+p.manufacturer:'');if(p.path===cur)o.selected=true;ps.appendChild(o)});
  }catch(e){
    ps.innerHTML='<option value="">获取失败</option>';
    T.write('Ports error: '+e.message+'\r\n');
  }
}
async function init(){
  await rp();
  try{
      let s;
      if(currentPort){
        const sr=await fetch(B+q('/status?port='+encodeURIComponent(currentPort)));
        s=await sr.json();
      }else{
        const r=await fetch(B+q('/status'));
        const list=await r.json();
        const arr=Array.isArray(list)?list:(list.connected?[list]:[]);
        const active=arr.filter(x=>x.connected);
        s=active[0]||{};
        if(s.port) currentPort=s.port;
      }
      const isCtrl=s.controllerClientId===CID;
      ctrl.textContent=isCtrl?'🎮 控制端':'👁 监视端';
      ctrl.style.color=isCtrl?'#4caf50':'#888';
    if(s.connected){
      conn=true;cb.textContent='断开';cb.style.background='#300';
      ps.value=s.port||'';bs.value=String(s.baudRate||115200);
      st.textContent=s.port;
      // 避免 auto=1 场景下 tc() 已调用 connectSSE() 导致重复连接
      // 同时检查 sseConnecting，防止 tc() 的连接还在建立中
      if((!es||es.readyState!==EventSource.OPEN)&&!sseConnecting){ connectSSE(); }
      connectWS();
    }else{
        const q=new URLSearchParams(location.search).get('port');
        if(q){currentPort=q;ps.value=q;connectSSE();}
      T.write('等待连接...\r\n');
    }
  }catch(_){T.write('等待连接...\r\n');}
  initDone=true;
}
init();
if(QP.get('auto')==='1' && QP.get('port')){
  setTimeout(()=>{
    // 等待 init() 完成，避免竞争
    if(initDone) return;
    if(!conn){
      ps.value=QP.get('port');
      tc();
    }
  }, 300);
}

async function copyText(){
  let s=T.getSelection()||'';
  if(!s)s=log.slice(-1<<15);
  try{await navigator.clipboard.writeText(s);}catch(_){}
}
function saveText(){
  let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([log],{type:'text/plain'}));
  a.download='serial-'+new Date().toISOString().slice(0,19).replace(/[:]/g,'-')+'.txt';a.click();
}
</script>
</body>
</html>
